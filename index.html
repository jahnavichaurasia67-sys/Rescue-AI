<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AI - Clear Navigation</title>
    
    <!-- TensorFlow.js for AI Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    
    <!-- Three.js for AR Arrow -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        /* Camera Container - Full screen */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* AR Canvas - Transparent overlay for arrow */
        canvas#ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* MINIMAL UI - Only essential info, no blocking */
        .mini-status {
            position: fixed;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
            font-size: 11px;
            color: #0f0;
            font-family: monospace;
            pointer-events: none;
            border-left: 2px solid #0ff;
        }
        
        /* Distance Badge - Small but visible */
        .distance-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 30px;
            z-index: 10;
            font-size: 14px;
            font-weight: bold;
            color: white;
            font-family: monospace;
            pointer-events: none;
            border: 1px solid #0ff;
        }
        
        /* CENTER DIRECTION HINT - Large and clear */
        .direction-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            padding: 16px 28px;
            border-radius: 60px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
            border: 2px solid #00ffff;
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
            min-width: 180px;
        }
        
        .direction-arrow {
            font-size: 48px;
            display: block;
            line-height: 1;
        }
        
        .direction-text {
            font-size: 20px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
        }
        
        .distance-large {
            font-size: 14px;
            margin-top: 5px;
            color: #0ff;
        }
        
        /* BOTTOM CONTROL BUTTONS - Small, non-intrusive */
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(0,255,255,0.3);
        }
        
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: monospace;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .btn-sos {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        
        .btn-voice {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        
        /* Hazard Alert - Small badge */
        .hazard-badge {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.6; }
        }
        
        /* AI Log - Hidden by default, appears only when needed */
        .ai-log-mini {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 12px;
            z-index: 10;
            font-size: 9px;
            font-family: monospace;
            color: #0f0;
            max-height: 60px;
            overflow-y: auto;
            pointer-events: none;
            display: none;
        }
        
        /* Voice indicator */
        .voice-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 18px;
            z-index: 20;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #0ff;
        }
        
        @media (max-width: 600px) {
            .direction-hint { padding: 12px 20px; min-width: 150px; }
            .direction-arrow { font-size: 38px; }
            .direction-text { font-size: 16px; }
            .distance-badge { font-size: 11px; padding: 5px 10px; top: 8px; right: 8px; }
            .mini-status { font-size: 9px; top: 8px; left: 8px; }
            button { padding: 6px 14px; font-size: 11px; }
            .control-bar { gap: 8px; padding: 6px 12px; bottom: 15px; }
        }
    </style>
</head>
<body>

<!-- Camera Feed -->
<div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
</div>

<!-- AR Canvas -->
<canvas id="ar-canvas"></canvas>

<!-- MINIMAL UI - No blocking -->
<div class="mini-status" id="aiStatusMini">
    🟢 AI Ready
</div>

<div class="distance-badge" id="distanceBadge">
    📍 Waiting...
</div>

<!-- Center Direction Hint - Main guidance -->
<div id="directionHint" class="direction-hint" style="display: none;">
    <div class="direction-arrow" id="directionArrow">⬆️</div>
    <div class="direction-text" id="directionText">AHEAD</div>
    <div class="distance-large" id="distanceSmall">--m to safety</div>
</div>

<!-- Hazard Alert -->
<div id="hazardBadge" class="hazard-badge" style="display: none;"></div>

<!-- Bottom Controls -->
<div class="control-bar">
    <button id="startBtn" class="btn-start">🚀 START</button>
    <button id="sosBtn" class="btn-sos">🆘 SOS</button>
    <button id="voiceBtn" class="btn-voice">🎤 VOICE</button>
</div>

<!-- Hidden AI Log (for debugging, shows when needed) -->
<div id="aiLog" class="ai-log-mini"></div>

<!-- Voice Indicator -->
<div id="voiceIndicator" class="voice-indicator">🎤 Listening...</div>

<script type="module">
    import * as THREE from 'three';
    
    // ---------------------------- GLOBALS ----------------------------
    let scene, arCamera, renderer, arrowGroup, arrowMesh;
    let deviceOrientation = { alpha: 0 };
    let userLocation = { lat: null, lng: null };
    let emergencyServices = [];
    let currentTarget = null;
    let aiModel = null;
    let videoElement = null;
    let isAutoMode = false;
    let aiInterval = null;
    let detectedHazards = [];
    let lastSpeechTime = 0;
    let speechRecognition = null;
    
    // DOM Elements
    const aiStatusMini = document.getElementById('aiStatusMini');
    const distanceBadge = document.getElementById('distanceBadge');
    const directionHint = document.getElementById('directionHint');
    const directionArrow = document.getElementById('directionArrow');
    const directionText = document.getElementById('directionText');
    const distanceSmall = document.getElementById('distanceSmall');
    const hazardBadge = document.getElementById('hazardBadge');
    const aiLogDiv = document.getElementById('aiLog');
    const voiceIndicator = document.getElementById('voiceIndicator');
    
    // ---------------------------- HELPER FUNCTIONS ----------------------------
    function addLog(msg, type = 'info') {
        const logEntry = document.createElement('div');
        logEntry.style.cssText = 'padding: 2px 0; border-bottom: 1px solid #333;';
        logEntry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        if (type === 'warning') logEntry.style.color = '#ff6b6b';
        else if (type === 'success') logEntry.style.color = '#51cf66';
        else if (type === 'danger') logEntry.style.color = '#ff4444';
        else logEntry.style.color = '#0f0';
        
        aiLogDiv.appendChild(logEntry);
        aiLogDiv.style.display = 'block';
        
        while (aiLogDiv.children.length > 20) {
            aiLogDiv.removeChild(aiLogDiv.firstChild);
        }
        
        // Auto-hide log after 8 seconds
        clearTimeout(window.logTimeout);
        window.logTimeout = setTimeout(() => {
            aiLogDiv.style.display = 'none';
        }, 8000);
        
        console.log(msg);
    }
    
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }
    
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    
    function getDirectionFromBearingDiff(bearingDiff) {
        const absDiff = Math.abs(bearingDiff);
        
        if (absDiff < 15) {
            return { arrow: "⬆️", text: "AHEAD", color: "#33ff33" };
        } else if (absDiff < 45) {
            if (bearingDiff > 0) return { arrow: "↗️", text: "RIGHT", color: "#ffaa33" };
            else return { arrow: "↖️", text: "LEFT", color: "#ffaa33" };
        } else if (absDiff < 90) {
            if (bearingDiff > 0) return { arrow: "➡️", text: "HARD RIGHT", color: "#ff6633" };
            else return { arrow: "⬅️", text: "HARD LEFT", color: "#ff6633" };
        } else {
            return { arrow: "🔄", text: "TURN BACK", color: "#ff3333" };
        }
    }
    
    function updateDirectionHint() {
        if (!currentTarget || !userLocation.lat || !isAutoMode) {
            directionHint.style.display = 'none';
            return;
        }
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const heading = deviceOrientation.alpha || 0;
        let bearingDiff = bearing - heading;
        
        if (bearingDiff > 180) bearingDiff -= 360;
        if (bearingDiff < -180) bearingDiff += 360;
        
        const direction = getDirectionFromBearingDiff(bearingDiff);
        
        directionArrow.innerHTML = direction.arrow;
        directionText.innerHTML = direction.text;
        distanceSmall.innerHTML = `${currentTarget.distance.toFixed(0)}m`;
        directionHint.style.borderColor = direction.color;
        directionHint.style.display = 'block';
        
        // Update distance badge
        if (currentTarget.distance < 100) {
            distanceBadge.innerHTML = `🔴 ${currentTarget.distance.toFixed(0)}m`;
            distanceBadge.style.borderColor = '#ff3333';
        } else if (currentTarget.distance < 300) {
            distanceBadge.innerHTML = `🟠 ${currentTarget.distance.toFixed(0)}m`;
            distanceBadge.style.borderColor = '#ffaa33';
        } else {
            distanceBadge.innerHTML = `🟢 ${currentTarget.distance.toFixed(0)}m`;
            distanceBadge.style.borderColor = '#33ff33';
        }
    }
    
    // ---------------------------- AI HAZARD DETECTION ----------------------------
    async function initAIModel() {
        addLog("Loading AI model...", 'info');
        try {
            aiModel = await cocoSsd.load();
            addLog("AI ready - detecting fire, people", 'success');
            aiStatusMini.innerHTML = "🟢 AI Ready";
            startCamera();
        } catch(e) {
            addLog("AI model failed", 'warning');
            aiStatusMini.innerHTML = "⚠️ AI Limited";
        }
    }
    
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            });
            videoElement = document.getElementById('video');
            videoElement.srcObject = stream;
            videoElement.play();
            addLog("Camera active", 'success');
            startDetectionLoop();
        } catch(e) {
            addLog("Camera access denied", 'warning');
        }
    }
    
    function startDetectionLoop() {
        async function detect() {
            if (!aiModel || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(detect);
                return;
            }
            try {
                const predictions = await aiModel.detect(videoElement);
                analyzeDisasters(predictions);
            } catch(e) {}
            requestAnimationFrame(detect);
        }
        detect();
    }
    
    function analyzeDisasters(predictions) {
        let hasFire = false;
        let hasPerson = false;
        
        for (let pred of predictions) {
            if (pred.score > 0.65) {
                if (pred.class === "fire") {
                    hasFire = true;
                } else if (pred.class === "person") {
                    hasPerson = true;
                }
            }
        }
        
        if (hasFire) {
            hazardBadge.innerHTML = "🔥 FIRE DETECTED! EVACUATE! 🔥";
            hazardBadge.style.display = 'block';
            if (isAutoMode && Date.now() - lastSpeechTime > 8000) {
                speak("Fire detected! Evacuate immediately!");
                lastSpeechTime = Date.now();
            }
        } else if (hasPerson) {
            hazardBadge.innerHTML = "👤 PERSON DETECTED";
            hazardBadge.style.display = 'block';
        } else {
            hazardBadge.style.display = 'none';
        }
    }
    
    // ---------------------------- EMERGENCY SERVICES ----------------------------
    async function fetchEmergencyServices(lat, lng) {
        addLog("Finding emergency services...", 'info');
        const url = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"="hospital"](around:3000,${lat},${lng});node["amenity"="fire_station"](around:3000,${lat},${lng});node["amenity"="police"](around:3000,${lat},${lng}););out;`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            const services = [];
            
            for (let elem of data.elements) {
                if (elem.lat && elem.lon) {
                    const dist = calculateDistance(lat, lng, elem.lat, elem.lon);
                    let name = elem.tags?.name || elem.tags?.amenity || "Emergency Point";
                    services.push({ lat: elem.lat, lng: elem.lon, name: name, distance: dist });
                }
            }
            
            emergencyServices = services.sort((a,b) => a.distance - b.distance);
            
            if (emergencyServices.length > 0) {
                addLog(`Found ${emergencyServices.length} services`, 'success');
            } else {
                addLog("No services found", 'warning');
            }
        } catch(e) {
            addLog("Failed to fetch services", 'warning');
        }
    }
    
    // ---------------------------- AI DECISION CYCLE ----------------------------
    async function aiDecisionCycle() {
        if (!isAutoMode) return;
        if (!userLocation.lat) return;
        
        if (emergencyServices.length === 0) {
            await fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        if (emergencyServices.length > 0 && !currentTarget) {
            currentTarget = emergencyServices[0];
            addLog(`Target: ${currentTarget.name}`, 'success');
            speak(`Guide to ${currentTarget.name}`);
        }
        
        if (currentTarget && userLocation.lat) {
            currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
            updateDirectionHint();
            
            if (currentTarget.distance < 50) {
                aiStatusMini.innerHTML = "✅ SAFE ZONE";
                speak("You have reached a safe zone");
                isAutoMode = false;
            }
        }
    }
    
    // ---------------------------- AR NAVIGATION ----------------------------
    function initAR() {
        const canvas = document.getElementById('ar-canvas');
        scene = new THREE.Scene();
        scene.background = null;
        
        arCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        arCamera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        
        arrowGroup = new THREE.Group();
        
        const coneGeo = new THREE.ConeGeometry(0.55, 1.6, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x0088aa,
            emissiveIntensity: 0.7,
            metalness: 0.9
        });
        arrowMesh = new THREE.Mesh(coneGeo, material);
        arrowMesh.position.y = 0.8;
        
        const cylinderGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.0, 8);
        const stem = new THREE.Mesh(cylinderGeo, material);
        stem.position.y = 0;
        
        arrowGroup.add(arrowMesh);
        arrowGroup.add(stem);
        arrowGroup.position.z = -2.0;
        arrowGroup.position.y = -0.2;
        
        scene.add(arrowGroup);
        
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        animate();
    }
    
    function animate() {
        requestAnimationFrame(animate);
        if (arrowGroup) {
            const scale = 1 + Math.sin(Date.now() * 0.012) * 0.08;
            arrowGroup.scale.set(scale, scale, scale);
        }
        if (renderer) renderer.render(scene, arCamera);
    }
    
    function updateArrowDirection() {
        if (!arrowGroup || !currentTarget || !userLocation.lat) return;
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const headingRad = (deviceOrientation.alpha || 0) * Math.PI / 180;
        let relativeAngle = (bearing * Math.PI/180) - headingRad;
        arrowGroup.rotation.y = -relativeAngle;
        
        if (currentTarget.distance < 100) {
            arrowMesh.material.color.setHex(0xff3333);
        } else if (currentTarget.distance < 300) {
            arrowMesh.material.color.setHex(0xffaa33);
        } else {
            arrowMesh.material.color.setHex(0x33ff33);
        }
    }
    
    // ---------------------------- GPS ----------------------------
    function startGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lng = position.coords.longitude;
                    if (emergencyServices.length === 0 && isAutoMode) {
                        fetchEmergencyServices(userLocation.lat, userLocation.lng);
                    }
                    if (currentTarget) {
                        currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
                        updateArrowDirection();
                    }
                },
                () => { distanceBadge.innerHTML = "📍 No GPS"; },
                { enableHighAccuracy: true }
            );
        }
    }
    
    // ---------------------------- VOICE COMMANDS ----------------------------
    function initVoiceCommands() {
        if (!('webkitSpeechRecognition' in window)) {
            addLog("Voice not supported", 'warning');
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.lang = 'en-US';
        
        const voiceBtn = document.getElementById('voiceBtn');
        let voiceTimeout;
        
        voiceBtn.addEventListener('mousedown', () => {
            speechRecognition.start();
            voiceIndicator.style.display = 'block';
            voiceTimeout = setTimeout(() => { voiceIndicator.style.display = 'none'; }, 3000);
        });
        voiceBtn.addEventListener('mouseup', () => {
            speechRecognition.stop();
        });
        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            speechRecognition.start();
            voiceIndicator.style.display = 'block';
        });
        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            speechRecognition.stop();
            voiceIndicator.style.display = 'none';
        });
        
        speechRecognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            addLog(`Voice: "${cmd}"`, 'info');
            voiceIndicator.style.display = 'none';
            
            if (cmd.includes("help") || cmd.includes("sos")) {
                triggerSOS();
            } else if (cmd.includes("where is safe")) {
                if (currentTarget) {
                    speak(`Safe zone is ${currentTarget.name}, ${currentTarget.distance.toFixed(0)} meters away`);
                }
            }
        };
    }
    
    function triggerSOS() {
        if (userLocation.lat && userLocation.lng) {
            const mapsUrl = `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
            window.location.href = `sms:112?body=SOS! Location: ${mapsUrl}`;
            addLog("SOS Triggered!", 'danger');
            speak("SOS triggered");
        } else {
            alert("Waiting for GPS");
        }
    }
    
    function startAutonomousMode() {
        if (aiInterval) clearInterval(aiInterval);
        isAutoMode = true;
        
        addLog("AUTONOMOUS MODE ACTIVE", 'success');
        aiStatusMini.innerHTML = "🟢 GUIDING";
        
        if (userLocation.lat && emergencyServices.length === 0) {
            fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        aiInterval = setInterval(() => aiDecisionCycle(), 3000);
        aiDecisionCycle();
        
        speak("Autonomous mode active. Follow the arrow.");
    }
    
    // ---------------------------- INITIALIZATION ----------------------------
    window.addEventListener('deviceorientation', (e) => {
        deviceOrientation.alpha = e.alpha;
        updateArrowDirection();
        updateDirectionHint();
    });
    
    window.addEventListener('resize', () => {
        if (renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            arCamera.aspect = window.innerWidth / window.innerHeight;
            arCamera.updateProjectionMatrix();
        }
    });
    
    window.onload = () => {
        initAR();
        startGPS();
        initVoiceCommands();
        initAIModel();
        
        document.getElementById('startBtn').addEventListener('click', startAutonomousMode);
        document.getElementById('sosBtn').addEventListener('click', triggerSOS);
        
        addLog("Rescue AI Ready - Clear Navigation", 'success');
    };
</script>
</body>
</html>
