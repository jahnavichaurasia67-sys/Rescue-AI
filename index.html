<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AI - Autonomous Disaster Response System</title>
    
    <!-- TensorFlow.js for AI Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    
    <!-- Three.js for AR Arrow -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        /* Camera Container - Full screen */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* AR Canvas - Transparent overlay for arrow ONLY - no black lines */
        canvas#ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* Main UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Status Panel */
        .status-panel {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            margin: 16px;
            padding: 16px;
            border-radius: 24px;
            border-left: 5px solid #00ffff;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .status-text {
            font-size: 15px;
            margin: 8px 0;
            color: #fff;
            font-weight: 500;
        }
        
        .status-text strong {
            color: #00ffff;
        }
        
        /* AI Decision Panel */
        .ai-decision-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            margin: 16px;
            padding: 16px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: auto;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .panel-title {
            color: #00ffff;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        /* Control Panel */
        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 16px;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(0, 255, 255, 0.4);
        }
        
        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            flex: 1;
            min-width: 110px;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            pointer-events: auto;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-sos {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        
        .btn-voice {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        
        /* Hazard Alert */
        .hazard-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: bold;
            margin: 5px 0;
            animation: pulse 1s infinite;
        }
        
        .safe-tag {
            background: linear-gradient(135deg, #00cc44, #009933);
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        
        /* AI Log Entries */
        .ai-log-entry {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #0f0;
        }
        
        .ai-warning { color: #ff6b6b; }
        .ai-success { color: #51cf66; }
        .ai-danger { color: #ff4444; font-weight: bold; }
        
        /* Distance Indicator - LARGE and CLEAR */
        .distance-indicator {
            position: fixed;
            bottom: 110px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            padding: 16px 20px;
            border-radius: 60px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            border: 2px solid rgba(0, 255, 255, 0.5);
        }
        
        /* Direction Hint - Shows which way to turn */
        .direction-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-radius: 80px;
            font-size: 28px;
            font-weight: bold;
            z-index: 15;
            pointer-events: none;
            text-align: center;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
            white-space: nowrap;
        }
        
        .direction-arrow {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        
        @media (max-width: 600px) {
            .status-text { font-size: 13px; }
            button { padding: 12px 14px; font-size: 13px; min-width: 90px; }
            .distance-indicator { font-size: 15px; padding: 12px 16px; bottom: 100px; }
            .direction-hint { padding: 15px 25px; font-size: 22px; }
            .direction-arrow { font-size: 38px; }
        }
    </style>
</head>
<body>

<!-- Camera Feed -->
<div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
</div>

<!-- AR Canvas -->
<canvas id="ar-canvas"></canvas>

<!-- Direction Hint - Shows clearly which way to go -->
<div id="directionHint" class="direction-hint" style="display: none;">
    <div class="direction-arrow" id="directionArrow">⬆️</div>
    <div id="directionText">AHEAD</div>
</div>

<!-- UI Overlay -->
<div class="ui-overlay">
    <div class="status-panel">
        <div class="status-text">🧠 <strong>RESCUE AI</strong> | Status: <span id="aiStatus">Initializing...</span></div>
        <div class="status-text">📍 <strong>Location:</strong> <span id="locationStatus">Waiting for GPS...</span></div>
        <div class="status-text">🎯 <strong>AI Goal:</strong> <span id="aiGoal">Analyzing Environment</span></div>
        <div class="status-text">📡 <strong>Nearest Safety:</strong> <span id="nearestSafety">Searching...</span></div>
        <div id="hazardAlert" class="status-text"></div>
    </div>
    
    <div class="ai-decision-panel">
        <div class="panel-title">🧠 AI DECISION LOG</div>
        <div id="aiLog">
            <div class="ai-log-entry">[System] Rescue AI v7.0 - Enhanced Arrow Visibility</div>
            <div class="ai-log-entry">[System] Loading AI models...</div>
        </div>
    </div>
</div>

<div class="distance-indicator" id="distanceIndicator">
    💡 Press START to activate AI guidance
</div>

<div class="control-panel">
    <div class="button-row">
        <button id="startBtn" class="btn-primary">🚀 START</button>
        <button id="sosBtn" class="btn-sos">🆘 SOS</button>
        <button id="voiceBtn" class="btn-voice">🎤 VOICE</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    
    // ---------------------------- GLOBALS ----------------------------
    let scene, arCamera, renderer, arrowGroup, arrowMesh;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let userLocation = { lat: null, lng: null };
    let emergencyServices = [];
    let currentTarget = null;
    let aiModel = null;
    let videoElement = null;
    let isAutoMode = false;
    let aiInterval = null;
    let currentGoal = "SCAN_ENVIRONMENT";
    let detectedHazards = [];
    let lastSpeechTime = 0;
    let speechRecognition = null;
    
    // DOM Elements
    const aiStatusSpan = document.getElementById('aiStatus');
    const locationStatusSpan = document.getElementById('locationStatus');
    const aiGoalSpan = document.getElementById('aiGoal');
    const nearestSafetySpan = document.getElementById('nearestSafety');
    const hazardAlertSpan = document.getElementById('hazardAlert');
    const aiLogDiv = document.getElementById('aiLog');
    const distanceIndicator = document.getElementById('distanceIndicator');
    const directionHint = document.getElementById('directionHint');
    const directionArrow = document.getElementById('directionArrow');
    const directionText = document.getElementById('directionText');
    
    // ---------------------------- HELPER FUNCTIONS ----------------------------
    function addLog(msg, type = 'info') {
        const logEntry = document.createElement('div');
        logEntry.className = 'ai-log-entry';
        if (type === 'warning') logEntry.classList.add('ai-warning');
        if (type === 'success') logEntry.classList.add('ai-success');
        if (type === 'danger') logEntry.classList.add('ai-danger');
        
        const time = new Date().toLocaleTimeString();
        let icon = '🤖';
        if (type === 'warning') icon = '⚠️';
        if (type === 'success') icon = '✅';
        if (type === 'danger') icon = '🔥';
        
        logEntry.innerHTML = `[${time}] ${icon} ${msg}`;
        aiLogDiv.appendChild(logEntry);
        aiLogDiv.scrollTop = aiLogDiv.scrollHeight;
        
        while (aiLogDiv.children.length > 35) {
            aiLogDiv.removeChild(aiLogDiv.firstChild);
        }
    }
    
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }
    
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    
    // Get cardinal direction from bearing difference
    function getDirectionFromBearingDiff(bearingDiff) {
        // bearingDiff is relative angle (-180 to 180)
        const absDiff = Math.abs(bearingDiff);
        
        if (absDiff < 15) {
            return { arrow: "⬆️", text: "AHEAD", color: "#33ff33" };
        } else if (absDiff < 45) {
            if (bearingDiff > 0) return { arrow: "↗️", text: "TURN RIGHT", color: "#ffaa33" };
            else return { arrow: "↖️", text: "TURN LEFT", color: "#ffaa33" };
        } else if (absDiff < 90) {
            if (bearingDiff > 0) return { arrow: "➡️", text: "SHARP RIGHT", color: "#ff6633" };
            else return { arrow: "⬅️", text: "SHARP LEFT", color: "#ff6633" };
        } else {
            if (bearingDiff > 0) return { arrow: "🔽", text: "TURN AROUND", color: "#ff3333" };
            else return { arrow: "🔽", text: "TURN AROUND", color: "#ff3333" };
        }
    }
    
    // Update direction hint display (CLEAR VISUAL GUIDE)
    function updateDirectionHint() {
        if (!currentTarget || !userLocation.lat || !isAutoMode) {
            directionHint.style.display = 'none';
            return;
        }
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const heading = deviceOrientation.alpha || 0;
        let bearingDiff = bearing - heading;
        
        // Normalize to -180 to 180
        if (bearingDiff > 180) bearingDiff -= 360;
        if (bearingDiff < -180) bearingDiff += 360;
        
        const direction = getDirectionFromBearingDiff(bearingDiff);
        
        directionArrow.innerHTML = direction.arrow;
        directionText.innerHTML = direction.text;
        directionHint.style.borderColor = direction.color;
        directionHint.style.display = 'block';
        
        // Auto-hide direction hint after 3 seconds of being on target
        if (Math.abs(bearingDiff) < 10) {
            setTimeout(() => {
                if (Math.abs(bearingDiff) < 10) {
                    // Keep visible but fade
                }
            }, 3000);
        }
    }
    
    // ---------------------------- AI HAZARD DETECTION ----------------------------
    async function initAIModel() {
        addLog("Loading AI disaster detection model...", 'info');
        try {
            aiModel = await cocoSsd.load();
            addLog("✅ AI model ready! Detecting: Fire, People, Obstacles", 'success');
            aiStatusSpan.innerHTML = "🟢 AI Active";
            startCamera();
        } catch(e) {
            addLog("❌ AI model failed: " + e.message, 'warning');
            aiStatusSpan.innerHTML = "⚠️ AI Limited";
        }
    }
    
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            videoElement = document.getElementById('video');
            videoElement.srcObject = stream;
            videoElement.play();
            addLog("📷 Camera active - scanning for disasters", 'success');
            startDetectionLoop();
        } catch(e) {
            addLog("❌ Camera access denied", 'warning');
        }
    }
    
    function startDetectionLoop() {
        async function detect() {
            if (!aiModel || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(detect);
                return;
            }
            try {
                const predictions = await aiModel.detect(videoElement);
                analyzeDisasters(predictions);
            } catch(e) {}
            requestAnimationFrame(detect);
        }
        detect();
    }
    
    function analyzeDisasters(predictions) {
        const newHazards = [];
        
        for (let pred of predictions) {
            if (pred.score > 0.65) {
                if (pred.class === "fire" || pred.class === "fire hydrant") {
                    newHazards.push({ name: "🔥 FIRE", priority: 1, message: "FIRE DETECTED! Evacuate immediately!" });
                } 
                else if (pred.class === "person") {
                    newHazards.push({ name: "👤 PERSON/VICTIM", priority: 2, message: "Person detected nearby." });
                }
                else if (pred.class === "chair" || pred.class === "couch" || pred.class === "dining table") {
                    newHazards.push({ name: "🪑 OBSTACLE", priority: 2, message: "Obstacle ahead. Navigate carefully." });
                }
            }
        }
        
        detectedHazards = newHazards;
        
        if (detectedHazards.length > 0) {
            const topHazard = detectedHazards[0];
            hazardAlertSpan.innerHTML = `<span class="hazard-tag">⚠️ ${topHazard.name} ⚠️</span>`;
            
            if (topHazard.priority === 1 && isAutoMode) {
                const now = Date.now();
                if (now - lastSpeechTime > 8000) {
                    speak(topHazard.message);
                    lastSpeechTime = now;
                    addLog(topHazard.message, 'danger');
                }
            }
        } else {
            hazardAlertSpan.innerHTML = '<span class="hazard-tag safe-tag">✅ No threats detected</span>';
        }
    }
    
    // ---------------------------- EMERGENCY SERVICES ----------------------------
    async function fetchEmergencyServices(lat, lng) {
        addLog("📡 Scanning for nearby emergency services...", 'info');
        const radius = 3000;
        const url = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"="hospital"](around:${radius},${lat},${lng});node["amenity"="fire_station"](around:${radius},${lat},${lng});node["amenity"="police"](around:${radius},${lat},${lng}););out;`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            const services = [];
            
            for (let elem of data.elements) {
                if (elem.lat && elem.lon) {
                    const dist = calculateDistance(lat, lng, elem.lat, elem.lon);
                    let name = elem.tags?.name || elem.tags?.amenity || "Emergency Point";
                    services.push({ lat: elem.lat, lng: elem.lon, name: name, distance: dist });
                }
            }
            
            emergencyServices = services.sort((a,b) => a.distance - b.distance);
            
            if (emergencyServices.length > 0) {
                addLog(`✅ Found ${emergencyServices.length} emergency services`, 'success');
                nearestSafetySpan.innerHTML = `${emergencyServices[0].name} (${emergencyServices[0].distance.toFixed(0)}m)`;
            } else {
                addLog("⚠️ No emergency services found", 'warning');
            }
        } catch(e) {
            addLog("❌ Failed to fetch services", 'warning');
        }
    }
    
    // ---------------------------- AI DECISION CYCLE ----------------------------
    async function aiDecisionCycle() {
        if (!isAutoMode) return;
        if (!userLocation.lat) return;
        
        const hasFire = detectedHazards.some(h => h.name.includes("FIRE"));
        const hasPerson = detectedHazards.some(h => h.name.includes("PERSON"));
        
        if (hasFire) {
            currentGoal = "EVACUATE IMMEDIATELY";
            aiStatusSpan.innerHTML = "🔥 EVACUATE NOW";
            speak("Fire detected! Evacuate immediately!");
            if (emergencyServices.length > 0) currentTarget = emergencyServices[0];
        }
        else if (hasPerson && !hasFire) {
            currentGoal = "ASSIST VICTIM";
            aiStatusSpan.innerHTML = "👤 ASSIST MODE";
        }
        else if (emergencyServices.length === 0) {
            currentGoal = "FETCHING SERVICES";
            await fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        else if (currentTarget && currentTarget.distance < 50) {
            currentGoal = "SAFETY REACHED";
            aiStatusSpan.innerHTML = "✅ SAFE ZONE";
            speak("You have reached a safe zone.");
            distanceIndicator.innerHTML = "✅ SAFETY REACHED! You are safe.";
        }
        else {
            currentGoal = "GUIDING TO SAFETY";
            aiStatusSpan.innerHTML = "🧭 GUIDING";
        }
        
        if ((currentGoal === "GUIDING TO SAFETY" || currentGoal === "EVACUATE IMMEDIATELY") && emergencyServices.length > 0 && !currentTarget) {
            currentTarget = emergencyServices[0];
            addLog(`🎯 AI selected: ${currentTarget.name} (${currentTarget.distance.toFixed(0)}m)`, 'success');
            speak(`Navigating to ${currentTarget.name}. ${currentTarget.distance.toFixed(0)} meters away.`);
        }
        
        if (currentTarget && userLocation.lat) {
            currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
            aiGoalSpan.innerHTML = currentGoal;
            nearestSafetySpan.innerHTML = `${currentTarget.name} (${currentTarget.distance.toFixed(0)}m)`;
            
            if (currentTarget.distance < 100) {
                distanceIndicator.innerHTML = `🔴 CRITICAL: ${currentTarget.distance.toFixed(0)}m to ${currentTarget.name}!`;
                distanceIndicator.style.borderColor = "#ff3333";
            } else if (currentTarget.distance < 300) {
                distanceIndicator.innerHTML = `🟠 GETTING CLOSE: ${currentTarget.distance.toFixed(0)}m to safety`;
                distanceIndicator.style.borderColor = "#ffaa33";
            } else {
                distanceIndicator.innerHTML = `🟢 FOLLOW ARROW: ${currentTarget.distance.toFixed(0)}m to ${currentTarget.name}`;
                distanceIndicator.style.borderColor = "#33ff33";
            }
            
            updateArrowDirection();
            updateDirectionHint();
        }
    }
    
    // ---------------------------- AR NAVIGATION - ENHANCED VISIBLE ARROW ----------------------------
    function initAR() {
        const canvas = document.getElementById('ar-canvas');
        scene = new THREE.Scene();
        scene.background = null;
        
        arCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        arCamera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        
        // Create LARGE, BRIGHT Arrow Group
        arrowGroup = new THREE.Group();
        
        // Main arrow body - BIGGER
        const coneGeo = new THREE.ConeGeometry(0.6, 1.8, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x00aaff,
            emissiveIntensity: 0.8,
            metalness: 0.9,
            roughness: 0.1
        });
        arrowMesh = new THREE.Mesh(coneGeo, material);
        arrowMesh.position.y = 0.9;
        
        const cylinderGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 12);
        const stem = new THREE.Mesh(cylinderGeo, material);
        stem.position.y = 0;
        
        // Add a glowing ring around arrow
        const ringGeo = new THREE.TorusGeometry(0.5, 0.05, 32, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x44ffff, emissive: 0x44ffff, emissiveIntensity: 0.5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 0.3;
        ring.rotation.x = Math.PI / 2;
        
        arrowGroup.add(arrowMesh);
        arrowGroup.add(stem);
        arrowGroup.add(ring);
        arrowGroup.position.z = -2.2;
        arrowGroup.position.y = -0.2;
        arrowGroup.position.x = 0;
        
        scene.add(arrowGroup);
        
        // Add floating particles for visibility
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 5;
            positions[i*3+1] = (Math.random() - 0.5) * 4 + 0.5;
            positions[i*3+2] = (Math.random() - 0.5) * 4 - 1;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x44aaff, size: 0.06, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        animate(particles);
    }
    
    function animate(particles) {
        requestAnimationFrame(() => animate(particles));
        if (arrowGroup && particles) {
            particles.rotation.y += 0.01;
            particles.rotation.x += 0.005;
            const scale = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            arrowGroup.scale.set(scale, scale, scale);
        }
        if (renderer) renderer.render(scene, arCamera);
    }
    
    function updateArrowDirection() {
        if (!arrowGroup || !currentTarget || !userLocation.lat) return;
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const headingRad = (deviceOrientation.alpha || 0) * Math.PI / 180;
        let relativeAngle = (bearing * Math.PI/180) - headingRad;
        arrowGroup.rotation.y = -relativeAngle;
        
        // Change arrow color based on distance
        if (currentTarget.distance < 100) {
            arrowMesh.material.color.setHex(0xff3333);
            arrowMesh.material.emissive.setHex(0xcc0000);
        } else if (currentTarget.distance < 300) {
            arrowMesh.material.color.setHex(0xffaa33);
            arrowMesh.material.emissive.setHex(0xcc8800);
        } else {
            arrowMesh.material.color.setHex(0x33ff33);
            arrowMesh.material.emissive.setHex(0x008800);
        }
    }
    
    // ---------------------------- GPS ----------------------------
    function startGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lng = position.coords.longitude;
                    locationStatusSpan.innerHTML = `${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)}`;
                    
                    if (emergencyServices.length === 0 && isAutoMode) {
                        fetchEmergencyServices(userLocation.lat, userLocation.lng);
                    }
                    
                    if (currentTarget) {
                        currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
                        updateArrowDirection();
                    }
                },
                (error) => {
                    locationStatusSpan.innerHTML = "Enable GPS";
                },
                { enableHighAccuracy: true }
            );
        }
    }
    
    // ---------------------------- VOICE COMMANDS ----------------------------
    function initVoiceCommands() {
        if (!('webkitSpeechRecognition' in window)) {
            addLog("Voice commands not supported", 'warning');
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.lang = 'en-US';
        
        const voiceBtn = document.getElementById('voiceBtn');
        
        voiceBtn.addEventListener('mousedown', () => {
            speechRecognition.start();
            addLog("🎤 Listening...", 'info');
        });
        voiceBtn.addEventListener('mouseup', () => {
            speechRecognition.stop();
        });
        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            speechRecognition.start();
        });
        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            speechRecognition.stop();
        });
        
        speechRecognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            addLog(`Voice: "${cmd}"`, 'info');
            
            if (cmd.includes("help") || cmd.includes("sos")) {
                triggerSOS();
            } else if (cmd.includes("where is safe")) {
                if (currentTarget) {
                    speak(`Nearest safe zone is ${currentTarget.name}, ${currentTarget.distance.toFixed(0)} meters away`);
                }
            } else if (cmd.includes("stop")) {
                isAutoMode = false;
                addLog("Auto mode paused", 'warning');
            } else if (cmd.includes("resume")) {
                startAutonomousMode();
            }
        };
    }
    
    function triggerSOS() {
        if (userLocation.lat && userLocation.lng) {
            const mapsUrl = `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
            window.location.href = `sms:112?body=EMERGENCY SOS! Location: ${mapsUrl}`;
            addLog("🚨 SOS TRIGGERED!", 'danger');
            speak("SOS triggered. Location shared.");
        } else {
            alert("Waiting for GPS...");
        }
    }
    
    function startAutonomousMode() {
        if (aiInterval) clearInterval(aiInterval);
        isAutoMode = true;
        
        addLog("🚀 AUTONOMOUS MODE ACTIVATED", 'success');
        addLog("🧠 Follow the BRIGHT ARROW and DIRECTION HINT", 'success');
        
        aiStatusSpan.innerHTML = "🟢 AUTONOMOUS ACTIVE";
        
        if (userLocation.lat && emergencyServices.length === 0) {
            fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        aiInterval = setInterval(() => aiDecisionCycle(), 3000);
        aiDecisionCycle();
        
        speak("Autonomous mode activated. Follow the arrow and direction guide on screen.");
    }
    
    // ---------------------------- INITIALIZATION ----------------------------
    window.addEventListener('deviceorientation', (e) => {
        deviceOrientation.alpha = e.alpha;
        updateArrowDirection();
        updateDirectionHint();
    });
    
    window.addEventListener('resize', () => {
        if (renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            arCamera.aspect = window.innerWidth / window.innerHeight;
            arCamera.updateProjectionMatrix();
        }
    });
    
    window.onload = () => {
        initAR();
        startGPS();
        initVoiceCommands();
        initAIModel();
        
        document.getElementById('startBtn').addEventListener('click', startAutonomousMode);
        document.getElementById('sosBtn').addEventListener('click', triggerSOS);
        
        addLog("✅ Rescue AI v7.0 Ready", 'success');
        addLog("📺 CLEAR DIRECTION GUIDE added - Look for the arrow AND text hint", 'success');
    };
</script>
</body>
</html>
