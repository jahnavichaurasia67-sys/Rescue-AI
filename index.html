<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AI - Clear Navigation</title>
    
    <!-- TensorFlow.js for AI Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    
    <!-- Three.js for AR Arrow -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        /* Camera Container - Full screen */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* AR Canvas - Transparent overlay for arrow */
        canvas#ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* TOP STATUS BAR - Shows location and nearest shelter */
        .top-status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.6));
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
        }
        
        .location-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .location-text {
            font-size: 11px;
            color: #aaa;
            font-family: monospace;
        }
        
        .location-value {
            font-size: 11px;
            color: #0ff;
            font-weight: bold;
            font-family: monospace;
        }
        
        .shelter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            padding-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .shelter-label {
            font-size: 10px;
            color: #aaa;
        }
        
        .shelter-name {
            font-size: 11px;
            color: #0f0;
            font-weight: bold;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .shelter-distance {
            font-size: 11px;
            color: #0ff;
            font-weight: bold;
        }
        
        /* AI Status Badge - Small */
        .ai-status-badge {
            position: fixed;
            top: 75px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
            border-left: 2px solid #0ff;
        }
        
        /* DIRECTION HINT - MOVED TO TOP-LEFT CORNER (Non-blocking) */
        .direction-hint {
            position: fixed;
            top: 85px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 30px;
            z-index: 15;
            pointer-events: none;
            text-align: center;
            border: 1.5px solid #00ffff;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            min-width: 100px;
        }
        
        .direction-arrow {
            font-size: 24px;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .direction-text {
            font-size: 14px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .distance-small {
            font-size: 10px;
            margin-top: 3px;
            color: #0ff;
            text-align: center;
        }
        
        /* BOTTOM CONTROL BUTTONS - Original style */
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 10px 14px;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(0, 255, 255, 0.4);
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: monospace;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .btn-sos {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        
        .btn-voice {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        
        /* Hazard Alert */
        .hazard-badge {
            position: fixed;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.6; }
        }
        
        /* Voice indicator */
        .voice-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 20;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            border: 2px solid #0ff;
        }
        
        @media (max-width: 600px) {
            .direction-hint { padding: 6px 12px; min-width: 85px; top: 80px; left: 10px; }
            .direction-arrow { font-size: 20px; margin-right: 5px; }
            .direction-text { font-size: 12px; }
            .distance-small { font-size: 9px; }
            .location-text, .location-value, .shelter-label, .shelter-name, .shelter-distance { font-size: 9px; }
            .top-status-bar { padding: 8px 10px; }
            .ai-status-badge { top: 72px; right: 8px; font-size: 9px; padding: 3px 8px; }
            button { padding: 8px 12px; font-size: 11px; }
            .control-bar { padding: 8px 12px; gap: 8px; }
            .hazard-badge { font-size: 10px; bottom: 90px; }
        }
    </style>
</head>
<body>

<!-- Camera Feed -->
<div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
</div>

<!-- AR Canvas -->
<canvas id="ar-canvas"></canvas>

<!-- TOP STATUS BAR - Location & Nearest Shelter -->
<div class="top-status-bar">
    <div class="location-row">
        <span class="location-text">📍 LOCATION:</span>
        <span class="location-value" id="locationDisplay">Waiting for GPS...</span>
    </div>
    <div class="shelter-row">
        <span class="shelter-label">🏥 NEAREST:</span>
        <span class="shelter-name" id="shelterName">Searching...</span>
        <span class="shelter-distance" id="shelterDistance"></span>
    </div>
</div>

<!-- AI Status Badge -->
<div class="ai-status-badge" id="aiStatusBadge">
    🟢 AI READY
</div>

<!-- DIRECTION HINT - TOP LEFT CORNER (Does not block view) -->
<div id="directionHint" class="direction-hint" style="display: none;">
    <span class="direction-arrow" id="directionArrow">⬆️</span>
    <span class="direction-text" id="directionText">AHEAD</span>
    <div class="distance-small" id="distanceSmall">--m</div>
</div>

<!-- Hazard Alert -->
<div id="hazardBadge" class="hazard-badge" style="display: none;"></div>

<!-- Bottom Control Buttons - Original Style -->
<div class="control-bar">
    <button id="startBtn" class="btn-start">🚀 START AUTONOMOUS MODE</button>
    <button id="sosBtn" class="btn-sos">🆘 SOS</button>
    <button id="voiceBtn" class="btn-voice">🎤 VOICE</button>
</div>

<!-- Voice Indicator -->
<div id="voiceIndicator" class="voice-indicator">🎤 Listening...</div>

<script type="module">
    import * as THREE from 'three';
    
    // ---------------------------- GLOBALS ----------------------------
    let scene, arCamera, renderer, arrowGroup, arrowMesh;
    let deviceOrientation = { alpha: 0 };
    let userLocation = { lat: null, lng: null };
    let emergencyServices = [];
    let currentTarget = null;
    let aiModel = null;
    let videoElement = null;
    let isAutoMode = false;
    let aiInterval = null;
    let lastSpeechTime = 0;
    let speechRecognition = null;
    
    // DOM Elements
    const locationDisplay = document.getElementById('locationDisplay');
    const shelterName = document.getElementById('shelterName');
    const shelterDistance = document.getElementById('shelterDistance');
    const aiStatusBadge = document.getElementById('aiStatusBadge');
    const directionHint = document.getElementById('directionHint');
    const directionArrow = document.getElementById('directionArrow');
    const directionText = document.getElementById('directionText');
    const distanceSmall = document.getElementById('distanceSmall');
    const hazardBadge = document.getElementById('hazardBadge');
    const voiceIndicator = document.getElementById('voiceIndicator');
    
    // ---------------------------- HELPER FUNCTIONS ----------------------------
    function addLog(msg) {
        console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
    }
    
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }
    
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    
    function getDirectionFromBearingDiff(bearingDiff) {
        const absDiff = Math.abs(bearingDiff);
        
        if (absDiff < 15) {
            return { arrow: "⬆️", text: "AHEAD", color: "#33ff33" };
        } else if (absDiff < 45) {
            if (bearingDiff > 0) return { arrow: "↗️", text: "RIGHT", color: "#ffaa33" };
            else return { arrow: "↖️", text: "LEFT", color: "#ffaa33" };
        } else if (absDiff < 90) {
            if (bearingDiff > 0) return { arrow: "➡️", text: "HARD RIGHT", color: "#ff6633" };
            else return { arrow: "⬅️", text: "HARD LEFT", color: "#ff6633" };
        } else {
            return { arrow: "🔄", text: "TURN BACK", color: "#ff3333" };
        }
    }
    
    function updateDirectionHint() {
        if (!currentTarget || !userLocation.lat || !isAutoMode) {
            directionHint.style.display = 'none';
            return;
        }
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const heading = deviceOrientation.alpha || 0;
        let bearingDiff = bearing - heading;
        
        if (bearingDiff > 180) bearingDiff -= 360;
        if (bearingDiff < -180) bearingDiff += 360;
        
        const direction = getDirectionFromBearingDiff(bearingDiff);
        
        directionArrow.innerHTML = direction.arrow;
        directionText.innerHTML = direction.text;
        distanceSmall.innerHTML = `${currentTarget.distance.toFixed(0)}m`;
        directionHint.style.borderColor = direction.color;
        directionHint.style.display = 'block';
        
        // Update shelter distance in top bar
        shelterDistance.innerHTML = `${currentTarget.distance.toFixed(0)}m`;
        
        // Color code distance in top bar
        if (currentTarget.distance < 100) {
            shelterDistance.style.color = '#ff4444';
            directionHint.style.backgroundColor = 'rgba(0,0,0,0.85)';
        } else if (currentTarget.distance < 300) {
            shelterDistance.style.color = '#ffaa33';
        } else {
            shelterDistance.style.color = '#33ff33';
        }
    }
    
    // ---------------------------- AI HAZARD DETECTION ----------------------------
    async function initAIModel() {
        addLog("Loading AI model...");
        try {
            aiModel = await cocoSsd.load();
            addLog("AI ready");
            aiStatusBadge.innerHTML = "🟢 AI ACTIVE";
            startCamera();
        } catch(e) {
            addLog("AI failed");
            aiStatusBadge.innerHTML = "⚠️ AI LIMITED";
        }
    }
    
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            });
            videoElement = document.getElementById('video');
            videoElement.srcObject = stream;
            videoElement.play();
            addLog("Camera active");
            startDetectionLoop();
        } catch(e) {
            addLog("Camera denied");
        }
    }
    
    function startDetectionLoop() {
        async function detect() {
            if (!aiModel || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(detect);
                return;
            }
            try {
                const predictions = await aiModel.detect(videoElement);
                analyzeDisasters(predictions);
            } catch(e) {}
            requestAnimationFrame(detect);
        }
        detect();
    }
    
    function analyzeDisasters(predictions) {
        let hasFire = false;
        let hasPerson = false;
        
        for (let pred of predictions) {
            if (pred.score > 0.65) {
                if (pred.class === "fire") {
                    hasFire = true;
                } else if (pred.class === "person") {
                    hasPerson = true;
                }
            }
        }
        
        if (hasFire) {
            hazardBadge.innerHTML = "🔥 FIRE DETECTED! EVACUATE! 🔥";
            hazardBadge.style.display = 'block';
            if (isAutoMode && Date.now() - lastSpeechTime > 8000) {
                speak("Fire detected! Evacuate immediately!");
                lastSpeechTime = Date.now();
                aiStatusBadge.innerHTML = "🔥 EVACUATE!";
            }
        } else if (hasPerson) {
            hazardBadge.innerHTML = "👤 PERSON DETECTED NEARBY";
            hazardBadge.style.display = 'block';
            aiStatusBadge.innerHTML = "👤 ASSIST MODE";
        } else {
            hazardBadge.style.display = 'none';
            if (isAutoMode) aiStatusBadge.innerHTML = "🧭 GUIDING";
        }
    }
    
    // ---------------------------- EMERGENCY SERVICES ----------------------------
    async function fetchEmergencyServices(lat, lng) {
        addLog("Finding emergency services...");
        const url = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"="hospital"](around:3000,${lat},${lng});node["amenity"="fire_station"](around:3000,${lat},${lng});node["amenity"="police"](around:3000,${lat},${lng}););out;`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            const services = [];
            
            for (let elem of data.elements) {
                if (elem.lat && elem.lon) {
                    const dist = calculateDistance(lat, lng, elem.lat, elem.lon);
                    let name = elem.tags?.name || elem.tags?.amenity || "Emergency Point";
                    name = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    services.push({ lat: elem.lat, lng: elem.lon, name: name, distance: dist });
                }
            }
            
            emergencyServices = services.sort((a,b) => a.distance - b.distance);
            
            if (emergencyServices.length > 0) {
                addLog(`Found: ${emergencyServices[0].name}`);
                shelterName.innerHTML = emergencyServices[0].name;
                shelterDistance.innerHTML = `${emergencyServices[0].distance.toFixed(0)}m`;
            } else {
                shelterName.innerHTML = "No services found";
                shelterDistance.innerHTML = "";
            }
        } catch(e) {
            addLog("Failed to fetch services");
            shelterName.innerHTML = "Search failed";
        }
    }
    
    // ---------------------------- AI DECISION CYCLE ----------------------------
    async function aiDecisionCycle() {
        if (!isAutoMode) return;
        if (!userLocation.lat) return;
        
        // Update location display
        locationDisplay.innerHTML = `${userLocation.lat.toFixed(5)}°, ${userLocation.lng.toFixed(5)}°`;
        
        if (emergencyServices.length === 0) {
            await fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        if (emergencyServices.length > 0 && !currentTarget) {
            currentTarget = emergencyServices[0];
            addLog(`Target: ${currentTarget.name}`);
            speak(`Guiding to ${currentTarget.name}`);
        }
        
        if (currentTarget && userLocation.lat) {
            currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
            updateDirectionHint();
            updateArrowDirection();
            
            if (currentTarget.distance < 50) {
                aiStatusBadge.innerHTML = "✅ SAFE ZONE";
                speak("You have reached a safe zone");
                isAutoMode = false;
            }
        }
    }
    
    // ---------------------------- AR NAVIGATION ----------------------------
    function initAR() {
        const canvas = document.getElementById('ar-canvas');
        scene = new THREE.Scene();
        scene.background = null;
        
        arCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        arCamera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        
        arrowGroup = new THREE.Group();
        
        const coneGeo = new THREE.ConeGeometry(0.55, 1.6, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x0088aa,
            emissiveIntensity: 0.7,
            metalness: 0.9
        });
        arrowMesh = new THREE.Mesh(coneGeo, material);
        arrowMesh.position.y = 0.8;
        
        const cylinderGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.0, 8);
        const stem = new THREE.Mesh(cylinderGeo, material);
        stem.position.y = 0;
        
        arrowGroup.add(arrowMesh);
        arrowGroup.add(stem);
        arrowGroup.position.z = -2.0;
        arrowGroup.position.y = -0.2;
        
        scene.add(arrowGroup);
        
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        
        animate();
    }
    
    function animate() {
        requestAnimationFrame(animate);
        if (arrowGroup) {
            const scale = 1 + Math.sin(Date.now() * 0.012) * 0.08;
            arrowGroup.scale.set(scale, scale, scale);
        }
        if (renderer) renderer.render(scene, arCamera);
    }
    
    function updateArrowDirection() {
        if (!arrowGroup || !currentTarget || !userLocation.lat) return;
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const headingRad = (deviceOrientation.alpha || 0) * Math.PI / 180;
        let relativeAngle = (bearing * Math.PI/180) - headingRad;
        arrowGroup.rotation.y = -relativeAngle;
        
        if (currentTarget.distance < 100) {
            arrowMesh.material.color.setHex(0xff3333);
        } else if (currentTarget.distance < 300) {
            arrowMesh.material.color.setHex(0xffaa33);
        } else {
            arrowMesh.material.color.setHex(0x33ff33);
        }
    }
    
    // ---------------------------- GPS ----------------------------
    function startGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lng = position.coords.longitude;
                    locationDisplay.innerHTML = `${userLocation.lat.toFixed(5)}°, ${userLocation.lng.toFixed(5)}°`;
                    
                    if (emergencyServices.length === 0 && isAutoMode) {
                        fetchEmergencyServices(userLocation.lat, userLocation.lng);
                    }
                    if (currentTarget) {
                        currentTarget.distance = calculateDistance(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
                        updateArrowDirection();
                        updateDirectionHint();
                    }
                },
                () => { 
                    locationDisplay.innerHTML = "Waiting for GPS...";
                },
                { enableHighAccuracy: true }
            );
        }
    }
    
    // ---------------------------- VOICE COMMANDS ----------------------------
    function initVoiceCommands() {
        if (!('webkitSpeechRecognition' in window)) {
            addLog("Voice not supported");
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.lang = 'en-US';
        
        const voiceBtn = document.getElementById('voiceBtn');
        let voiceTimeout;
        
        voiceBtn.addEventListener('mousedown', () => {
            speechRecognition.start();
            voiceIndicator.style.display = 'block';
            voiceTimeout = setTimeout(() => { voiceIndicator.style.display = 'none'; }, 3000);
        });
        voiceBtn.addEventListener('mouseup', () => {
            speechRecognition.stop();
        });
        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            speechRecognition.start();
            voiceIndicator.style.display = 'block';
        });
        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            speechRecognition.stop();
            voiceIndicator.style.display = 'none';
        });
        
        speechRecognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            addLog(`Voice: "${cmd}"`);
            voiceIndicator.style.display = 'none';
            
            if (cmd.includes("help") || cmd.includes("sos")) {
                triggerSOS();
            } else if (cmd.includes("where is safe")) {
                if (currentTarget) {
                    speak(`Safe zone is ${currentTarget.name}, ${currentTarget.distance.toFixed(0)} meters away`);
                }
            } else if (cmd.includes("stop")) {
                isAutoMode = false;
                aiStatusBadge.innerHTML = "⏸️ PAUSED";
                speak("Autonomous mode stopped");
            } else if (cmd.includes("start") || cmd.includes("resume")) {
                startAutonomousMode();
            }
        };
    }
    
    function triggerSOS() {
        if (userLocation.lat && userLocation.lng) {
            const mapsUrl = `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
            window.location.href = `sms:112?body=🚨 RESCUE AI SOS! Emergency assistance needed. Location: ${mapsUrl}`;
            addLog("SOS Triggered!");
            speak("SOS triggered. Location shared.");
        } else {
            alert("Waiting for GPS... Please allow location access.");
        }
    }
    
    function startAutonomousMode() {
        if (aiInterval) clearInterval(aiInterval);
        isAutoMode = true;
        
        addLog("AUTONOMOUS MODE ACTIVATED");
        aiStatusBadge.innerHTML = "🧭 GUIDING";
        
        if (userLocation.lat && emergencyServices.length === 0) {
            fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        aiInterval = setInterval(() => aiDecisionCycle(), 3000);
        aiDecisionCycle();
        
        speak("Autonomous mode activated. Follow the arrow to safety.");
    }
    
    // ---------------------------- INITIALIZATION ----------------------------
    window.addEventListener('deviceorientation', (e) => {
        deviceOrientation.alpha = e.alpha;
        updateArrowDirection();
        updateDirectionHint();
    });
    
    window.addEventListener('resize', () => {
        if (renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            arCamera.aspect = window.innerWidth / window.innerHeight;
            arCamera.updateProjectionMatrix();
        }
    });
    
    window.onload = () => {
        initAR();
        startGPS();
        initVoiceCommands();
        initAIModel();
        
        document.getElementById('startBtn').addEventListener('click', startAutonomousMode);
        document.getElementById('sosBtn').addEventListener('click', triggerSOS);
        
        addLog("Rescue AI Ready - Clear Navigation");
    };
</script>
</body>
</html>
