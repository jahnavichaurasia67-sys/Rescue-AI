<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AI - Autonomous Disaster Response System</title>
    
    <!-- TensorFlow.js for AI Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    
    <!-- Three.js for AR Arrow -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        /* Camera Container - Full screen, no overlays interfering */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* AR Canvas - Transparent overlay for arrow only */
        canvas#ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* Main UI Overlay - Clear, readable, no black lines on face */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Status Panel - Large, readable, semi-transparent */
        .status-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            margin: 16px;
            padding: 16px;
            border-radius: 24px;
            border-left: 5px solid #00ffff;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .status-text {
            font-size: 16px;
            margin: 8px 0;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .status-text strong {
            color: #00ffff;
        }
        
        /* AI Decision Panel */
        .ai-decision-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            margin: 16px;
            padding: 16px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: auto;
            max-height: 220px;
            overflow-y: auto;
        }
        
        .panel-title {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        /* Control Panel - Bottom, large buttons */
        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 16px;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: auto;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-sos {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        
        .btn-voice {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }
        
        /* Hazard Alert - Prominent */
        .hazard-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0;
            animation: pulse 1s infinite;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        
        .safe-tag {
            background: linear-gradient(135deg, #00cc44, #009933);
            animation: none;
            box-shadow: 0 0 10px rgba(0,204,68,0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        
        /* AI Log Entries */
        .ai-log-entry {
            font-size: 13px;
            font-family: 'Courier New', monospace;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #0f0;
            line-height: 1.4;
        }
        
        .ai-warning {
            color: #ff6b6b;
        }
        
        .ai-success {
            color: #51cf66;
        }
        
        .ai-danger {
            color: #ff4444;
            font-weight: bold;
        }
        
        /* Distance Indicator - Large and clear */
        .distance-indicator {
            position: fixed;
            bottom: 110px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            padding: 14px 18px;
            border-radius: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            font-family: inherit;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Scrollbar Styling */
        .ai-decision-panel::-webkit-scrollbar {
            width: 4px;
        }
        
        .ai-decision-panel::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .ai-decision-panel::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }
        
        /* Goal Highlight */
        #aiGoal {
            color: #00ffff;
            font-weight: bold;
            font-size: 18px;
            background: rgba(0,255,255,0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        
        @media (max-width: 600px) {
            .status-text { font-size: 14px; }
            button { padding: 12px 16px; font-size: 14px; min-width: 100px; }
            .distance-indicator { font-size: 15px; bottom: 105px; }
            .panel-title { font-size: 12px; }
            .ai-log-entry { font-size: 11px; }
            .hazard-tag { font-size: 14px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

<!-- Camera Feed -->
<div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
</div>

<!-- AR Canvas - Arrow only, no black lines -->
<canvas id="ar-canvas"></canvas>

<!-- UI Overlay -->
<div class="ui-overlay">
    <div class="status-panel">
        <div class="status-text">🧠 <strong>RESCUE AI</strong> | Status: <span id="aiStatus" style="color:#00ff00;">Initializing...</span></div>
        <div class="status-text">📍 <strong>Location:</strong> <span id="locationStatus">Waiting for GPS...</span></div>
        <div class="status-text">🎯 <strong>AI Goal:</strong> <span id="aiGoal">Analyzing Environment</span></div>
        <div class="status-text">📡 <strong>Nearest Safety:</strong> <span id="nearestSafety">Searching...</span></div>
        <div id="hazardAlert" class="status-text"></div>
    </div>
    
    <div class="ai-decision-panel">
        <div class="panel-title">🧠 AI DECISION LOG</div>
        <div id="aiLog">
            <div class="ai-log-entry">[System] Rescue AI v6.0 - Autonomous Disaster Response</div>
            <div class="ai-log-entry">[System] Loading AI models...</div>
        </div>
    </div>
</div>

<div class="distance-indicator" id="distanceIndicator">
    💡 Press START to activate AI guidance
</div>

<div class="control-panel">
    <div class="button-row">
        <button id="startBtn" class="btn-primary">🚀 START AUTONOMOUS MODE</button>
        <button id="sosBtn" class="btn-sos">🆘 SOS</button>
        <button id="voiceBtn" class="btn-voice">🎤 VOICE</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    
    // ---------------------------- GLOBALS ----------------------------
    let scene, arCamera, renderer, arrowGroup, arrowMesh, particles;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let userLocation = { lat: null, lng: null };
    let emergencyServices = [];
    let currentTarget = null;
    let aiModel = null;
    let videoElement = null;
    let isAutoMode = false;
    let aiInterval = null;
    let currentGoal = "SCAN_ENVIRONMENT";
    let detectedHazards = [];
    let lastSpeechTime = 0;
    let speechRecognition = null;
    
    // DOM Elements
    const aiStatusSpan = document.getElementById('aiStatus');
    const locationStatusSpan = document.getElementById('locationStatus');
    const aiGoalSpan = document.getElementById('aiGoal');
    const nearestSafetySpan = document.getElementById('nearestSafety');
    const hazardAlertSpan = document.getElementById('hazardAlert');
    const aiLogDiv = document.getElementById('aiLog');
    const distanceIndicator = document.getElementById('distanceIndicator');
    
    // ---------------------------- HELPER FUNCTIONS ----------------------------
    function addLog(msg, type = 'info') {
        const logEntry = document.createElement('div');
        logEntry.className = 'ai-log-entry';
        if (type === 'warning') logEntry.classList.add('ai-warning');
        if (type === 'success') logEntry.classList.add('ai-success');
        if (type === 'danger') logEntry.classList.add('ai-danger');
        
        const time = new Date().toLocaleTimeString();
        let icon = '🤖';
        if (type === 'warning') icon = '⚠️';
        if (type === 'success') icon = '✅';
        if (type === 'danger') icon = '🔥';
        
        logEntry.innerHTML = `[${time}] ${icon} ${msg}`;
        aiLogDiv.appendChild(logEntry);
        aiLogDiv.scrollTop = aiLogDiv.scrollHeight;
        
        while (aiLogDiv.children.length > 35) {
            aiLogDiv.removeChild(aiLogDiv.firstChild);
        }
        
        console.log(msg);
    }
    
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }
    
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    
    // ---------------------------- AI HAZARD DETECTION (Camera) ----------------------------
    async function initAIModel() {
        addLog("Loading AI disaster detection model (COCO-SSD)...", 'info');
        try {
            aiModel = await cocoSsd.load();
            addLog("✅ AI model ready! Camera will detect: Fire, People, Obstacles", 'success');
            aiStatusSpan.innerHTML = "🟢 AI Active";
            startCamera();
        } catch(e) {
            addLog("❌ AI model failed to load: " + e.message, 'warning');
            aiStatusSpan.innerHTML = "⚠️ AI Limited";
        }
    }
    
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            videoElement = document.getElementById('video');
            videoElement.srcObject = stream;
            videoElement.play();
            addLog("📷 Camera active - AI analyzing feed for disasters", 'success');
            startDetectionLoop();
        } catch(e) {
            addLog("❌ Camera access denied. AR navigation only.", 'warning');
        }
    }
    
    function startDetectionLoop() {
        async function detect() {
            if (!aiModel || !videoElement || videoElement.readyState < 2) {
                requestAnimationFrame(detect);
                return;
            }
            
            try {
                const predictions = await aiModel.detect(videoElement);
                analyzeDisasters(predictions);
            } catch(e) {}
            
            requestAnimationFrame(detect);
        }
        detect();
    }
    
    function analyzeDisasters(predictions) {
        const newHazards = [];
        
        for (let pred of predictions) {
            if (pred.score > 0.65) {
                let hazardType = null;
                
                if (pred.class === "fire" || pred.class === "fire hydrant") {
                    hazardType = { name: "🔥 FIRE", priority: 1, message: "FIRE DETECTED! Evacuate immediately!" };
                } 
                else if (pred.class === "person") {
                    hazardType = { name: "👤 PERSON/VICTIM", priority: 2, message: "Person detected nearby. Offer assistance if safe." };
                }
                else if (pred.class === "chair" || pred.class === "couch" || pred.class === "dining table" || pred.class === "bench") {
                    hazardType = { name: "🪑 OBSTACLE", priority: 2, message: "Obstacle ahead. Navigate carefully." };
                }
                else if (pred.class === "bottle" || pred.class === "cup" || pred.class === "suitcase") {
                    hazardType = { name: "💧 DEBRIS", priority: 2, message: "Debris detected. Watch your step." };
                }
                
                if (hazardType) {
                    newHazards.push(hazardType);
                }
            }
        }
        
        detectedHazards = newHazards;
        
        if (detectedHazards.length > 0) {
            const topHazard = detectedHazards[0];
            hazardAlertSpan.innerHTML = `<span class="hazard-tag">⚠️ ${topHazard.name} DETECTED ⚠️</span>`;
            
            if (topHazard.priority === 1 && isAutoMode) {
                const now = Date.now();
                if (now - lastSpeechTime > 8000) {
                    speak(topHazard.message);
                    lastSpeechTime = now;
                    addLog(topHazard.message, 'danger');
                }
            }
        } else {
            hazardAlertSpan.innerHTML = '<span class="hazard-tag safe-tag">✅ No immediate threats detected</span>';
        }
    }
    
    // ---------------------------- AI DECISION ENGINE ----------------------------
    async function fetchEmergencyServices(lat, lng) {
        addLog("📡 Scanning for nearby emergency services...", 'info');
        const radius = 3000;
        const url = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"="hospital"](around:${radius},${lat},${lng});node["amenity"="fire_station"](around:${radius},${lat},${lng});node["amenity"="police"](around:${radius},${lat},${lng}););out;`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            const services = [];
            
            for (let elem of data.elements) {
                if (elem.lat && elem.lon) {
                    const dist = calculateDistance(lat, lng, elem.lat, elem.lon);
                    let name = elem.tags?.name || elem.tags?.amenity || "Emergency Point";
                    services.push({
                        lat: elem.lat,
                        lng: elem.lon,
                        name: name,
                        type: elem.tags?.amenity,
                        distance: dist
                    });
                }
            }
            
            emergencyServices = services.sort((a,b) => a.distance - b.distance);
            
            if (emergencyServices.length > 0) {
                addLog(`✅ Found ${emergencyServices.length} emergency services`, 'success');
                nearestSafetySpan.innerHTML = `${emergencyServices[0].name} (${emergencyServices[0].distance.toFixed(0)}m)`;
            } else {
                addLog("⚠️ No emergency services found in 3km radius", 'warning');
                nearestSafetySpan.innerHTML = "None found - call emergency services";
            }
        } catch(e) {
            addLog("❌ Failed to fetch services: " + e.message, 'warning');
        }
    }
    
    async function aiDecisionCycle() {
        if (!isAutoMode) return;
        if (!userLocation.lat) return;
        
        const hasFire = detectedHazards.some(h => h.name.includes("FIRE"));
        const hasPerson = detectedHazards.some(h => h.name.includes("PERSON"));
        
        if (hasFire) {
            currentGoal = "EVACUATE IMMEDIATELY";
            aiStatusSpan.innerHTML = "🔥 EVACUATE NOW";
            aiStatusSpan.style.color = "#ff4444";
            speak("Fire detected! Evacuate immediately. Follow the arrow.");
            addLog("🔥 HIGH PRIORITY: Fire hazard detected - evacuating now!", 'danger');
            
            if (emergencyServices.length > 0) {
                currentTarget = emergencyServices[0];
            }
        }
        else if (hasPerson && !hasFire) {
            currentGoal = "ASSIST VICTIM";
            aiStatusSpan.innerHTML = "👤 ASSIST MODE";
            aiStatusSpan.style.color = "#ffaa44";
            aiGoalSpan.innerHTML = "Help nearby person";
        }
        else if (emergencyServices.length === 0) {
            currentGoal = "FETCHING SERVICES";
            aiStatusSpan.innerHTML = "🔄 Scanning";
            await fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        else if (currentTarget && currentTarget.distance < 50) {
            currentGoal = "SAFETY REACHED";
            aiStatusSpan.innerHTML = "✅ SAFE ZONE";
            aiStatusSpan.style.color = "#51cf66";
            speak("You have reached a safe zone. Stay safe.");
            addLog("🎉 SAFETY REACHED! AI mission complete.", 'success');
            distanceIndicator.innerHTML = "✅ SAFETY REACHED! You are in a safe area.";
        }
        else {
            currentGoal = "GUIDING TO SAFETY";
            aiStatusSpan.innerHTML = "🧭 GUIDING";
            aiStatusSpan.style.color = "#00ffff";
        }
        
        if (currentGoal === "GUIDING TO SAFETY" && emergencyServices.length > 0 && !currentTarget) {
            currentTarget = emergencyServices[0];
            addLog(`🎯 AI selected: ${currentTarget.name} (${currentTarget.distance.toFixed(0)}m away)`, 'success');
            speak(`Navigating to ${currentTarget.name}. ${currentTarget.distance.toFixed(0)} meters away.`);
        }
        
        if (currentTarget && userLocation.lat) {
            currentTarget.distance = calculateDistance(
                userLocation.lat, userLocation.lng,
                currentTarget.lat, currentTarget.lng
            );
            
            aiGoalSpan.innerHTML = currentGoal;
            nearestSafetySpan.innerHTML = `${currentTarget.name} (${currentTarget.distance.toFixed(0)}m)`;
            
            if (currentTarget.distance < 100) {
                distanceIndicator.innerHTML = `🔴 CRITICAL: ${currentTarget.distance.toFixed(0)}m to ${currentTarget.name}! Turn carefully!`;
                distanceIndicator.style.background = 'rgba(255,0,0,0.9)';
                distanceIndicator.style.color = '#fff';
            } else if (currentTarget.distance < 300) {
                distanceIndicator.innerHTML = `🟠 GETTING CLOSE: ${currentTarget.distance.toFixed(0)}m to safety - Continue following arrow`;
                distanceIndicator.style.background = 'rgba(255,165,0,0.9)';
                distanceIndicator.style.color = '#fff';
            } else {
                distanceIndicator.innerHTML = `🟢 FOLLOW ARROW: ${currentTarget.distance.toFixed(0)}m to ${currentTarget.name}`;
                distanceIndicator.style.background = 'rgba(0,0,0,0.85)';
                distanceIndicator.style.color = '#fff';
            }
            
            updateArrowDirection();
        }
    }
    
    // ---------------------------- AR NAVIGATION (Three.js - Clean, No Black Lines) ----------------------------
    function initAR() {
        const canvas = document.getElementById('ar-canvas');
        scene = new THREE.Scene();
        scene.background = null;
        
        arCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        arCamera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        
        // Create Arrow - Clear, bright, no black edges
        arrowGroup = new THREE.Group();
        
        // Main arrow body with glow effect
        const coneGeo = new THREE.ConeGeometry(0.45, 1.3, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x0088aa,
            emissiveIntensity: 0.6,
            metalness: 0.8,
            roughness: 0.2
        });
        arrowMesh = new THREE.Mesh(coneGeo, material);
        arrowMesh.position.y = 0.65;
        
        const cylinderGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.9, 8);
        const stem = new THREE.Mesh(cylinderGeo, material);
        stem.position.y = 0;
        
        arrowGroup.add(arrowMesh);
        arrowGroup.add(stem);
        arrowGroup.position.z = -1.8;
        arrowGroup.position.y = -0.3;
        arrowGroup.position.x = 0;
        
        scene.add(arrowGroup);
        
        // Floating particles around arrow - for better visibility
        const particleCount = 150;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 4;
            positions[i*3+1] = (Math.random() - 0.5) * 3 + 0.5;
            positions[i*3+2] = (Math.random() - 0.5) * 3 - 1;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x44aaff, size: 0.04, transparent: true, opacity: 0.7 });
        particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // Add ambient light to make arrow pop
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x00ffff, 0.5);
        backLight.position.set(0, 0, 2);
        scene.add(backLight);
        
        animate();
    }
    
    function animate() {
        requestAnimationFrame(animate);
        if (arrowGroup && particles) {
            particles.rotation.y += 0.008;
            particles.rotation.x += 0.004;
            const scale = 1 + Math.sin(Date.now() * 0.008) * 0.08;
            arrowGroup.scale.set(scale, scale, scale);
        }
        if (renderer) renderer.render(scene, arCamera);
    }
    
    function updateArrowDirection() {
        if (!arrowGroup || !currentTarget || !userLocation.lat) return;
        
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const headingRad = (deviceOrientation.alpha || 0) * Math.PI / 180;
        let relativeAngle = (bearing * Math.PI/180) - headingRad;
        arrowGroup.rotation.y = -relativeAngle;
        
        // Change arrow color based on distance
        if (currentTarget.distance < 100) {
            arrowMesh.material.color.setHex(0xff3333);
            arrowMesh.material.emissive.setHex(0xcc0000);
        } else if (currentTarget.distance < 300) {
            arrowMesh.material.color.setHex(0xffaa33);
            arrowMesh.material.emissive.setHex(0xcc8800);
        } else {
            arrowMesh.material.color.setHex(0x33ff33);
            arrowMesh.material.emissive.setHex(0x008800);
        }
    }
    
    // ---------------------------- GPS & LOCATION ----------------------------
    function startGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    locationStatusSpan.innerHTML = `${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)} (±${accuracy.toFixed(0)}m)`;
                    
                    if (emergencyServices.length === 0 && isAutoMode) {
                        fetchEmergencyServices(userLocation.lat, userLocation.lng);
                    }
                    
                    if (currentTarget) {
                        currentTarget.distance = calculateDistance(
                            userLocation.lat, userLocation.lng,
                            currentTarget.lat, currentTarget.lng
                        );
                        updateArrowDirection();
                    }
                },
                (error) => {
                    locationStatusSpan.innerHTML = "Permission needed - Enable GPS";
                    addLog("❌ GPS error: " + error.message, 'warning');
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        } else {
            locationStatusSpan.innerHTML = "GPS not supported";
        }
    }
    
    // ---------------------------- VOICE COMMANDS ----------------------------
    function initVoiceCommands() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            addLog("Voice commands not supported in this browser", 'warning');
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.lang = 'en-US';
        
        const voiceBtn = document.getElementById('voiceBtn');
        let isListening = false;
        
        voiceBtn.addEventListener('mousedown', () => {
            try {
                speechRecognition.start();
                isListening = true;
                voiceBtn.style.opacity = '0.7';
                addLog("🎤 Listening for command...", 'info');
            } catch(e) {}
        });
        
        voiceBtn.addEventListener('mouseup', () => {
            try {
                speechRecognition.stop();
                isListening = false;
                voiceBtn.style.opacity = '1';
            } catch(e) {}
        });
        
        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            try {
                speechRecognition.start();
                isListening = true;
                voiceBtn.style.opacity = '0.7';
                addLog("🎤 Listening for command...", 'info');
            } catch(e) {}
        });
        
        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            try {
                speechRecognition.stop();
                isListening = false;
                voiceBtn.style.opacity = '1';
            } catch(e) {}
        });
        
        speechRecognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            addLog(`Voice command: "${cmd}"`, 'info');
            
            if (cmd.includes("help") || cmd.includes("sos") || cmd.includes("emergency")) {
                triggerSOS();
            } else if (cmd.includes("where is safe") || cmd.includes("location") || cmd.includes("guide me")) {
                if (currentTarget) {
                    const msg = `Nearest safe zone is ${currentTarget.name}, ${currentTarget.distance.toFixed(0)} meters away. Follow the arrow.`;
                    speak(msg);
                    addLog(msg, 'success');
                } else {
                    speak("Searching for nearby emergency services");
                }
            } else if (cmd.includes("stop") || cmd.includes("pause")) {
                isAutoMode = false;
                addLog("Autonomous mode paused", 'warning');
                speak("Autonomous mode paused");
            } else if (cmd.includes("resume") || cmd.includes("start") || cmd.includes("activate")) {
                startAutonomousMode();
            }
        };
        
        speechRecognition.onerror = (event) => {
            if (isListening) {
                addLog("Voice recognition error. Please try again.", 'warning');
            }
        };
    }
    
    // ---------------------------- SOS FUNCTION ----------------------------
    function triggerSOS() {
        if (userLocation.lat && userLocation.lng) {
            const mapsUrl = `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
            const message = `🚨 RESCUE AI SOS! Emergency assistance needed immediately. My location: ${mapsUrl}`;
            window.location.href = `sms:112?body=${encodeURIComponent(message)}`;
            addLog("🚨 SOS TRIGGERED! Location shared via SMS", 'danger');
            speak("SOS triggered. Your location has been shared.");
        } else {
            alert("Waiting for GPS... Please allow location access.");
            addLog("Cannot send SOS - GPS location not available", 'warning');
        }
    }
    
    // ---------------------------- START AUTONOMOUS MODE ----------------------------
    function startAutonomousMode() {
        if (aiInterval) clearInterval(aiInterval);
        isAutoMode = true;
        currentGoal = "INITIALIZING";
        
        addLog("🚀 AUTONOMOUS MODE ACTIVATED", 'success');
        addLog("🧠 AI is now analyzing camera feed for disasters", 'success');
        addLog("🎯 AI will automatically guide you to the nearest safety zone", 'success');
        
        aiStatusSpan.innerHTML = "🟢 AUTONOMOUS ACTIVE";
        aiStatusSpan.style.color = "#00ff00";
        
        if (userLocation.lat && emergencyServices.length === 0) {
            fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }
        
        aiInterval = setInterval(() => aiDecisionCycle(), 3000);
        aiDecisionCycle();
        
        speak("Rescue AI autonomous mode activated. I will guide you to safety. Follow the arrow.");
    }
    
    // ---------------------------- DEVICE ORIENTATION ----------------------------
    window.addEventListener('deviceorientation', (e) => {
        deviceOrientation.alpha = e.alpha;
        updateArrowDirection();
    });
    
    // Handle window resize
    window.addEventListener('resize', () => {
        if (renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            arCamera.aspect = window.innerWidth / window.innerHeight;
            arCamera.updateProjectionMatrix();
        }
    });
    
    // ---------------------------- INITIALIZATION ----------------------------
    window.onload = () => {
        initAR();
        startGPS();
        initVoiceCommands();
        initAIModel();
        
        document.getElementById('startBtn').addEventListener('click', startAutonomousMode);
        document.getElementById('sosBtn').addEventListener('click', triggerSOS);
        
        addLog("✅ Rescue AI v6.0 Ready - Autonomous Disaster Response System", 'success');
        addLog("📸 Camera will detect: Fire, People, Obstacles in real-time", 'info');
        addLog("🎤 Voice commands: 'Help/SOS', 'Where is safe', 'Stop', 'Resume'", 'info');
        addLog("🧭 AR Arrow will guide you - hold phone level for best results", 'info');
    };
</script>
</body>
