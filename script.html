<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AI - Autonomous Emergency Response System</title>
    <!-- TensorFlow.js and COCO-SSD for AI Perception -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <!-- Three.js for AR/3D -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <!-- Leaflet for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Orbitron', monospace;
            color: white;
        }
        /* UI Overlays */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 15px;
            pointer-events: auto;
            border: 1px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
            z-index: 20;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: monospace;
        }
        button:active {
            transform: scale(0.96);
        }
        .ai-thought {
            background: rgba(0,0,0,0.7);
            border-left: 4px solid #0ff;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: monospace;
            backdrop-filter: blur(4px);
        }
        .status-card {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid #0ff;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 15;
        }
        .hazard-warning {
            color: #ff5555;
            text-shadow: 0 0 5px red;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; text-shadow: 0 0 12px red; }
        }
        #sosBtn {
            background: red;
            box-shadow: 0 0 15px red;
        }
        #voiceCmdBtn {
            background: #2c3e66;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #aiLog {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
        }
        @keyframes arrowGlow {
            0% { filter: drop-shadow(0 0 2px cyan); }
            100% { filter: drop-shadow(0 0 20px #00ffff); }
        }
        .compass-hint {
            position: absolute;
            bottom: 100px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 5px 10px;
            font-size: 0.7rem;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            button { padding: 8px 16px; font-size: 0.9rem; }
            .ai-thought { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="status-card">
        <div>🧠 <strong>Rescue AI Core</strong> | Status: <span id="aiState">Initializing...</span></div>
        <div>📍 Location: <span id="locStatus">Waiting for GPS</span> | 🧭 Heading: <span id="headingVal">0°</span></div>
        <div>🎯 Active Goal: <span id="activeGoal">Analyzing environment</span></div>
        <div id="aiThoughts" class="ai-thought">🤖 AI: Loading neural networks...</div>
    </div>
    
    <div class="control-panel">
        <div class="flex-row">
            <button id="startBtn">🚨 START AUTONOMOUS MODE</button>
            <button id="sosBtn">🆘 SOS - SEND LOCATION</button>
            <button id="voiceCmdBtn">🎤 VOICE COMMAND (Hold)</button>
        </div>
        <div id="aiLog" class="ai-thought">
            📡 Rescue AI v2.0 | Autonomous Decision Engine Active<br>
        </div>
        <div class="compass-hint">🧭 AR Arrow follows device orientation</div>
    </div>
</div>

<!-- Canvas for Three.js -->
<canvas id="arCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>

<script type="module">
    import * as THREE from 'three';
    
    // ---------- GLOBALS ----------
    let scene, camera, renderer, arrowGroup, arrowMesh, particles;
    let deviceOrientation = { alpha: 0, beta: 0, gamma: 0 };
    let currentTarget = null;      // { lat, lng, name, distance }
    let userLocation = { lat: 28.6139, lng: 77.2090 }; // Default Delhi, will update via GPS
    let emergencyServices = [];
    let aiModel = null;
    let videoElement = null;
    let objectDetectionActive = false;
    let aiDecisionInterval = null;
    let lastDetectedHazards = [];
    let aiMemory = []; // store past events
    let isAutoMode = false;
    let currentGoal = "SCAN_ENVIRONMENT";
    let speechRecognition = null;
    
    // UI Elements
    const aiStateSpan = document.getElementById('aiState');
    const locStatusSpan = document.getElementById('locStatus');
    const headingSpan = document.getElementById('headingVal');
    const activeGoalSpan = document.getElementById('activeGoal');
    const aiThoughtsDiv = document.getElementById('aiThoughts');
    const aiLogDiv = document.getElementById('aiLog');
    
    // Helper: Log to AI console
    function aiLog(msg, isImportant = true) {
        const logMsg = `🤖 [${new Date().toLocaleTimeString()}] ${msg}`;
        const logDiv = document.getElementById('aiLog');
        logDiv.innerHTML += `<div>${logMsg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        if (isImportant) {
            aiThoughtsDiv.innerHTML = `🤖 AI: ${msg}`;
            setTimeout(() => {
                if(aiThoughtsDiv.innerHTML.includes(msg)) aiThoughtsDiv.innerHTML = "🤖 AI: Monitoring...";
            }, 4000);
        }
        console.log(msg);
    }
    
    // ---------- 1. AI PERCEPTION (TensorFlow Hazard Detection) ----------
    async function initAIModel() {
        aiLog("Loading AI Perception Model (COCO-SSD)...");
        aiStateSpan.innerText = "Loading AI";
        try {
            aiModel = await cocoSsd.load();
            aiLog("✅ AI Model ready. Detecting hazards in real-time.");
            aiStateSpan.innerText = "Active | AI Online";
            startVideoStream();
        } catch(e) {
            aiLog("⚠️ AI Model failed: " + e.message, true);
            aiStateSpan.innerText = "AI Error";
        }
    }
    
    async function startVideoStream() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            videoElement = document.createElement('video');
            videoElement.srcObject = stream;
            videoElement.setAttribute("playsinline", "");
            videoElement.play();
            objectDetectionActive = true;
            detectFrame();
            aiLog("Camera active: AI Hazard Detection running.");
        } catch(e) {
            aiLog("Camera permission denied. AI vision limited.", true);
        }
    }
    
    async function detectFrame() {
        if (!objectDetectionActive || !aiModel || !videoElement || videoElement.readyState < 2) {
            requestAnimationFrame(detectFrame);
            return;
        }
        try {
            const predictions = await aiModel.detect(videoElement);
            processDetections(predictions);
        } catch(err) {}
        requestAnimationFrame(detectFrame);
    }
    
    function processDetections(predictions) {
        const hazards = [];
        for (let pred of predictions) {
            if (pred.score > 0.6) {
                let hazardType = "unknown";
                let priority = 2;
                if (pred.class === "fire") { hazardType = "🔥 FIRE"; priority = 1; }
                else if (pred.class === "person") { hazardType = "👤 VICTIM"; priority = 2; }
                else if (pred.class === "chair" || pred.class === "dining table" || pred.class === "couch") { hazardType = "🪑 OBSTACLE"; priority = 3; }
                else if (pred.class === "door") hazardType = "🚪 EXIT/DOOR";
                else continue;
                
                hazards.push({ type: hazardType, priority, confidence: pred.score });
                if (priority === 1) {
                    aiLog(`⚠️ HIGH PRIORITY: ${hazardType} detected!`, true);
                }
            }
        }
        lastDetectedHazards = hazards;
        // AI will use this data for decision
    }
    
    // ---------- 2. AI DECISION ENGINE (Think & Act) ----------
    async function aiDecisionCycle() {
        if (!isAutoMode) return;
        
        // 1. Update goal based on hazards and environment
        let highRisk = lastDetectedHazards.some(h => h.type === "🔥 FIRE");
        let hasVictim = lastDetectedHazards.some(h => h.type === "👤 VICTIM");
        
        if (highRisk) {
            currentGoal = "EVACUATE_IMMEDIATELY";
            aiLog("🔥 FIRE HAZARD - Evacuation priority max", false);
        } else if (hasVictim && !highRisk) {
            currentGoal = "ASSIST_VICTIM";
            aiLog("👤 Victim detected. AI analyzing rescue path.", false);
        } else if (!currentTarget || (currentTarget.distance > 150)) {
            currentGoal = "FIND_SAFE_ZONE";
        } else if (currentTarget && currentTarget.distance < 30) {
            currentGoal = "SAFETY_REACHED";
        } else {
            currentGoal = "FOLLOW_NAVIGATION";
        }
        
        activeGoalSpan.innerText = currentGoal.replace(/_/g, ' ');
        
        // 2. Act based on goal
        switch(currentGoal) {
            case "EVACUATE_IMMEDIATELY":
                // Override target: find nearest exit or outside area (from emergency services)
                if (emergencyServices.length > 0) {
                    let nearest = getNearestService(emergencyServices);
                    if (nearest) setTarget(nearest.lat, nearest.lng, nearest.name);
                }
                // Trigger SOS if fire not yet alerted
                if (Math.random() < 0.05) triggerSOS("FIRE detected - autonomous alert");
                break;
            case "ASSIST_VICTIM":
                aiLog("Guiding toward detected victim area. Check AR direction.", false);
                break;
            case "FIND_SAFE_ZONE":
                if (emergencyServices.length === 0) await fetchEmergencyServices(userLocation.lat, userLocation.lng);
                if (emergencyServices.length) {
                    let safeTarget = getNearestService(emergencyServices);
                    setTarget(safeTarget.lat, safeTarget.lng, safeTarget.name);
                }
                break;
            case "SAFETY_REACHED":
                aiLog("✅ SAFETY REACHED! AI will monitor for new threats.");
                break;
            default:
                break;
        }
        
        // 3. Add memory of decision
        aiMemory.unshift({ time: Date.now(), goal: currentGoal, hazards: lastDetectedHazards.length });
        if (aiMemory.length > 20) aiMemory.pop();
    }
    
    function getNearestService(services) {
        if (!services.length) return null;
        let minDist = Infinity, nearest = null;
        for (let s of services) {
            const d = haversine(userLocation.lat, userLocation.lng, s.lat, s.lng);
            if (d < minDist) { minDist = d; nearest = s; }
        }
        if (nearest) nearest.distance = minDist;
        return nearest;
    }
    
    function setTarget(lat, lng, name) {
        if (!currentTarget || currentTarget.name !== name) {
            currentTarget = { lat, lng, name, distance: haversine(userLocation.lat, userLocation.lng, lat, lng) };
            aiLog(`🎯 AI selected target: ${name} (${currentTarget.distance.toFixed(0)}m away)`);
        } else {
            currentTarget.distance = haversine(userLocation.lat, userLocation.lng, lat, lng);
        }
        updateArrowDirection();
    }
    
    // ---------- 3. LOCATION & MAPPING (Overpass API) ----------
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1)*Math.PI/180;
        const Δλ = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R*c;
    }
    
    async function fetchEmergencyServices(lat, lng) {
        const radius = 2000;
        const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"="hospital"](around:${radius},${lat},${lng});node["amenity"="fire_station"](around:${radius},${lat},${lng});node["amenity"="police"](around:${radius},${lat},${lng}););out;`;
        try {
            const resp = await fetch(overpassUrl);
            const data = await resp.json();
            const services = [];
            for (let elem of data.elements) {
                services.push({
                    lat: elem.lat,
                    lng: elem.lon,
                    name: elem.tags.name || (elem.tags.amenity || "Emergency Point"),
                    type: elem.tags.amenity
                });
            }
            emergencyServices = services;
            aiLog(`AI fetched ${services.length} nearby emergency services.`);
            if (services.length && !currentTarget) setTarget(services[0].lat, services[0].lng, services[0].name);
        } catch(e) { aiLog("Failed to fetch emergency data: " + e.message); }
    }
    
    function startGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                userLocation.lat = pos.coords.latitude;
                userLocation.lng = pos.coords.longitude;
                locStatusSpan.innerText = `${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`;
                if (currentTarget) {
                    currentTarget.distance = haversine(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
                    updateArrowDirection();
                    // color coded distance alerts
                    if (currentTarget.distance < 30) aiLog("🔴 ARRIVING AT SAFETY ZONE", true);
                    else if (currentTarget.distance < 100) aiLog("🟠 Getting close: " + currentTarget.distance.toFixed(0) + "m", false);
                }
                if (emergencyServices.length === 0 && isAutoMode) fetchEmergencyServices(userLocation.lat, userLocation.lng);
            }, (err) => { aiLog("GPS Error: " + err.message); }, { enableHighAccuracy: true });
        }
    }
    
    // ---------- 4. AR NAVIGATION (Three.js) ----------
    function initThree() {
        const canvas = document.getElementById('arCanvas');
        scene = new THREE.Scene();
        scene.background = null; // transparent for camera overlay
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        
        // Arrow
        arrowGroup = new THREE.Group();
        const coneGeo = new THREE.ConeGeometry(0.4, 1.2, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x0088aa });
        arrowMesh = new THREE.Mesh(coneGeo, material);
        arrowMesh.position.y = 0.6;
        const cylinderGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
        const stem = new THREE.Mesh(cylinderGeo, material);
        stem.position.y = 0;
        arrowGroup.add(arrowMesh);
        arrowGroup.add(stem);
        arrowGroup.position.z = -1.5;
        arrowGroup.position.y = -0.5;
        scene.add(arrowGroup);
        
        // Particles
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 8;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 6;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 5 - 2;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x44aaff, size: 0.05 });
        particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        const light = new THREE.AmbientLight(0x404060);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1,2,1);
        scene.add(dirLight);
        
        animate();
    }
    
    function animate() {
        requestAnimationFrame(animate);
        if (arrowGroup && particles) {
            particles.rotation.y += 0.01;
            particles.rotation.x += 0.005;
            // pulsing arrow
            const scale = 1 + Math.sin(Date.now() * 0.008) * 0.1;
            arrowGroup.scale.set(scale, scale, scale);
        }
        renderer.render(scene, camera);
    }
    
    function updateArrowDirection() {
        if (!currentTarget || !userLocation) return;
        const bearing = calculateBearing(userLocation.lat, userLocation.lng, currentTarget.lat, currentTarget.lng);
        const headingRad = (deviceOrientation.alpha || 0) * Math.PI / 180;
        let relativeAngle = bearing * Math.PI/180 - headingRad;
        // Normalize
        if (arrowGroup) arrowGroup.rotation.y = -relativeAngle;
        // update distance color
        const dist = currentTarget.distance;
        let color = 0x00ff00;
        if (dist < 30) color = 0xff3333;
        else if (dist < 100) color = 0xffaa33;
        else color = 0x33ff33;
        arrowMesh.material.color.setHex(color);
    }
    
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
        let θ = Math.atan2(y, x);
        return (θ * 180 / Math.PI + 360) % 360;
    }
    
    // ---------- 5. AUTONOMOUS ACTIONS & VOICE ----------
    function triggerSOS(message = "SOS from Rescue AI") {
        const smsBody = `${message}. My location: https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
        window.location.href = `sms:112?body=${encodeURIComponent(smsBody)}`;
        aiLog("🚨 SOS triggered: Location shared via SMS.");
    }
    
    function initVoiceCommands() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            aiLog("Voice commands not supported.");
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = false;
        speechRecognition.lang = 'en-US';
        
        const voiceBtn = document.getElementById('voiceCmdBtn');
        voiceBtn.addEventListener('mousedown', () => {
            speechRecognition.start();
            aiLog("🎤 Listening for command...");
        });
        voiceBtn.addEventListener('mouseup', () => {
            speechRecognition.stop();
        });
        speechRecognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            aiLog(`Voice command: "${cmd}"`);
            if (cmd.includes("help") || cmd.includes("sos")) triggerSOS("Voice SOS");
            else if (cmd.includes("where is safe")) aiLog("Follow the cyan arrow to nearest emergency point.");
            else if (cmd.includes("stop")) isAutoMode = false;
            else if (cmd.includes("resume")) { isAutoMode = true; aiDecisionCycle(); }
        };
    }
    
    // ---------- 6. START AUTONOMOUS MODE ----------
    function startAutonomousMode() {
        isAutoMode = true;
        aiLog("🧠 RESCUE AI FULLY AUTONOMOUS - Analyzing, Deciding, Acting.");
        if (aiDecisionInterval) clearInterval(aiDecisionInterval);
        aiDecisionInterval = setInterval(() => aiDecisionCycle(), 3000);
        if (!currentTarget && emergencyServices.length) setTarget(emergencyServices[0].lat, emergencyServices[0].lng, emergencyServices[0].name);
        else if (!currentTarget) fetchEmergencyServices(userLocation.lat, userLocation.lng);
        startGPS();
        aiStateSpan.innerText = "AUTONOMOUS ACTIVE";
    }
    
    // Device Orientation
    window.addEventListener('deviceorientation', (e) => {
        deviceOrientation.alpha = e.alpha;
        deviceOrientation.beta = e.beta;
        deviceOrientation.gamma = e.gamma;
        headingSpan.innerText = Math.round(e.alpha || 0) + "°";
        updateArrowDirection();
    });
    
    // Event Listeners
    document.getElementById('startBtn').addEventListener('click', () => {
        startAutonomousMode();
    });
    document.getElementById('sosBtn').addEventListener('click', () => triggerSOS("Manual SOS by user"));
    
    // Initialization
    async function init() {
        initThree();
        initAIModel();
        startGPS();
        initVoiceCommands();
        // initial fetch
        setTimeout(() => {
            if (userLocation) fetchEmergencyServices(userLocation.lat, userLocation.lng);
        }, 2000);
        aiLog("Rescue AI Core online. Press START AUTONOMOUS MODE for full AI autonomy.");
    }
    
    init();
</script>
</body>
</html>
